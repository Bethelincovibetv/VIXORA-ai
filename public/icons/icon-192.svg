<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="50%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#cc0066" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="44" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Ambient outline ring -->
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" />

  <!-- Center Icon Shape -->
  <g transform="translate(46, 42)" filter="url(#glow)">
    <!-- Custom stylized rocket spark logo -->
    <path d="M 50,5 C 50,5 90,45 65,75 C 60,80 50,85 50,95 L 45,95 L 40,95 C 40,85 30,80 25,75 C 0,45 40,5 50,5 Z" fill="url(#accentGrad)" />
    <!-- Glowing pulse circles -->
    <circle cx="50" cy="50" r="6" fill="#ffffff" />
    <circle cx="28" cy="30" r="3" fill="#ffaa00" />
    <circle cx="72" cy="70" r="4" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
