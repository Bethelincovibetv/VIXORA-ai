<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa00" />
      <stop offset="50%" stop-color="#ff6600" />
      <stop offset="100%" stop-color="#cc0066" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="12" />

  <!-- Ambient outline ring -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.4" />

  <!-- Center Icon Shape -->
  <g transform="translate(126, 116)" filter="url(#glow)">
    <!-- Custom stylized rocket spark logo -->
    <path d="M 130,10 C 130,10 230,110 170,190 C 155,210 130,220 130,250 L 120,250 L 110,250 C 110,220 85,210 70,190 C 10,110 110,10 130,10 Z" fill="url(#accentGrad)" />
    <!-- Glowing pulse circles -->
    <circle cx="130" cy="130" r="15" fill="#ffffff" />
    <circle cx="70" cy="80" r="8" fill="#ffaa00" />
    <circle cx="190" cy="180" r="10" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
