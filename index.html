    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          -webkit-tap-highlight-color: transparent; 
          background-color: #020617;
          color: #f8fafc;
          overflow-x: hidden;
        }
        .glass-card { 
          background: rgba(15, 23, 42, 0.6); 
          backdrop-filter: blur(20px); 
          border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        /* Animated Mesh Background */
        .mesh-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .mesh-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: drift 20s infinite alternate ease-in-out;
        }

        .orb-1 { width: 500px; height: 500px; background: #ff6600; top: -100px; right: -100px; animation-duration: 25s; }
        .orb-2 { width: 400px; height: 400px; background: #3b82f6; bottom: -50px; left: -50px; animation-duration: 30s; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: #8b5cf6; top: 40%; left: 10%; animation-duration: 22s; }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(120px, 60px) scale(1.15); }
        }

        .text-glow {
            text-shadow: 0 0 25px rgba(255, 102, 0, 0.5);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-rise { animation: fadeInUp 0.8s ease-out forwards; }

        .bg-ggd-orange { background-color: #ff6600; }
        .text-ggd-orange { color: #ff6600; }
        .border-ggd-orange { border-color: #ff6600; }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div class="mesh-container">
        <div class="mesh-orb orb-1"></div>
        <div class="mesh-orb orb-2"></div>
        <div class="mesh-orb orb-3"></div>
    </div>
    <div id="root"></div>

</body>
